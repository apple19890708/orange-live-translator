# 複製成 config.yaml 再修改；沒有 config.yaml 時使用這份的預設值。

audio:
  # tab：只聽 Chrome 擴充功能指定的分頁（在擴充功能按「聽譯這個分頁」）
  # system：聽整台電腦正在播的聲音（遊戲、Discord 也會收到）
  source: tab
  # source=system 時使用：空白 = 系統預設輸出裝置；也可填裝置名稱的一部分，例如 "Realtek"
  device: ""

asr:
  model: large-v3              # large-v3（較準，預設）或 large-v3-turbo（快約 3 倍，但日文較常聽錯）
  device: cuda
  compute_type: int8_float16   # 顯示記憶體不足可改 int8
  language: auto               # auto（自動判斷）、ja（只聽日文）、en（只聽英文）
  languages: [ja, en]          # auto 時只在這些語言中判斷
  vad_threshold: 0.5           # 0～1，越高越不容易把背景音當人聲
  vad_mode: window             # window＝每次重算最近 1 秒（原本）；stateful＝連續偵測，保留前後狀態（激動喊叫較不會漏，I16）
  vad_end_threshold: null      # stateful 專用：「還在說話」的門檻（null = 同 vad_threshold）。這個模型在句間停頓時機率仍偏高，門檻要高一點句子才不會拖長
  vad_keep: max                # stateful 專用：「還在說話」看每 100ms 裡的 max（最高）／mean（平均）／last（最後一個 32ms 視窗）
  min_silence_ms: 600          # 停頓多久算一句結束
  incomplete_hold_ms: 1000     # 句子像沒講完（〜て、〜けど、and…）時多等多久，0 = 關閉
  soft_max_s: 6                # 一句超過幾秒後，短暫換氣就切句（降低長句延遲）
  soft_pause_ms: 250           # 上面說的「短暫換氣」長度
  prompt_chars: 60             # 給 Whisper 的前文字數（實測 60 最好）
  prompt_seed: えっと、それはそうなんだけど、でも難しいよね。じゃあ、次いきます！   # 有標點的範例句，讓辨識結果帶「、。！？」
  resegment: false             # 依「。！？」重新斷句。實測會讓譯文缺上下文（翻譯 chrF 25.8→27.0 關掉較好，E38），預設關閉
  resegment_split: true        # resegment 開啟時：一段多句是否拆開
  merge_gap_s: 0                # >0 時：短句（merge_short_s 秒內）後面緊接著下一句（間隔小於此秒數）就合併重聽。
                               # 能修好字被切兩半的情況，但實測整體錯誤率變高，預設關閉
  merge_short_s: 3.5
  max_utterance_s: 12          # 一句最長幾秒；超過時切在後半段最安靜（換氣）的地方
  glossary_hotwords: true      # 詞彙表的日文詞也當辨識提示；看別的主播時可能干擾（例：「公演」讓「公園」被聽成「公演」）；但實測關掉後連沒調校過的主播也變差（12.9%→14.6%，E64）
  hotwords:                    # 辨識提示：人名、活動、專有名詞，讓 Whisper 優先聽成這些詞（詞彙表的日文詞會自動加入）
    ja: [チケット, パスポート, 通販, 会場, スタッフ]
    en: []
  partial_interval_s: 0.8      # 說話中多久更新一次暫定字幕
  min_speech_ms: 300           # 太短的聲音忽略
  loud_rms: 0                  # 大聲說話時不算停頓（激動喊叫時 VAD 常判斷錯，I16）：音量門檻，例 0.05；0 = 關閉（實測對照組變好、調校組的歌曲段變差，未採用，E63）
  loud_min_prob: 0.05          # 配合 loud_rms：VAD 機率至少要這麼多（純音樂通常接近 0）
  retry_sparse: false          # 定稿太稀疏（前文提示讓 Whisper 跳過句子開頭，I16）就不給前文重聽
  sparse_min_s: 5.0            # retry_sparse：句子至少幾秒才檢查
  sparse_chars_per_s: 3.0      # retry_sparse：每秒少於幾個字算太稀疏

translate:
  provider: ollama             # ollama 或 openai（任何 OpenAI 相容 API，例如 OpenRouter）
  model: hf.co/tencent/Hy-MT2-1.8B-GGUF:Q8_0   # 預設模型（英文、日英夾雜、models 沒列到的語言）；翻譯專用 1.8B，顯示記憶體 2.1GB（qwen3:8b 要 5.2GB），英文 chrF 36.7 vs 36.5（E66）
  models:                      # 依原文語言指定模型；名稱含 sakura 會自動套用 Sakura 專用提示詞
    ja: hf.co/SakuraLLM/Sakura-GalTransl-7B-v3.7:IQ4_XS   # 日翻中專用，口語和語氣比 qwen3:8b 好
  base_url: http://127.0.0.1:11434
  api_key_env: ""              # provider=openai 時，從這個環境變數讀金鑰
  temperature: 0.2
  raw_prompt: auto             # Hy-MT2 專用：auto = 1.8B 自動改用 raw 模式（Ollama 對它自動產生的對話範本是壞的，E66）
  context_sentences: 4         # 翻譯時附帶前幾句（6、8 句實測 chrF 反而較低，E65）
  memory_size: 0               # 翻譯記憶：同一句原文沿用第一次的譯文（例 3000）；實測翻譯 chrF 26.7→26.3，預設關閉（E43）
  target: zh-TW
  opencc: s2twp                # 簡轉繁＋台灣用語；空白則不轉
  glossary: glossary.yaml

replay:                        # 依影片時間快取字幕（Chrome 分頁聽譯 YouTube 時）
  enabled: true                # 往回拉時間軸重看已翻過的段落：直接顯示當時的字幕，不重新辨識、翻譯（譯文一致）
  min_cover: 0.5               # 一句有多少比例落在已翻過的範圍內，就改用快取字幕（0～1）

refine:                        # 直播後精聽（run.bat refine 錄音.pcm）
  language: ""                 # 空白 = 沿用 asr.language（auto 時用 ja）
  beam_size: 5
  condition_on_previous_text: true   # 把前面辨識結果當上下文（離線才適合）
  hotwords: false              # 不要開：整段離線辨識時提示詞會引發幻聽迴圈（實測 CER 361%）
  initial_prompt: ""           # 不要給範例句：同樣會引發幻聽（實測 CER 52%）
  vad_min_silence_ms: 500
  word_timestamps: false       # 字級時間會讓辨識變差（實測 4.5%→5.0%），預設關閉

server:
  host: 127.0.0.1
  port: 8765

overlay:
  enabled: true
  font_size: 26
  source_font_size: 16
  show_source: true            # 是否顯示原文（日文／英文）
  width: 1100
  lines: 2                     # 同時顯示幾句
  opacity: 0.75                # 背景不透明度

log:
  save_srt: true               # 即時字幕存成 logs/*.srt
  save_audio: true             # 同時把聽到的聲音存成 logs/*.pcm（約 115MB／小時），聽錯時可回放比對
  keep_audio: 3                # 只保留最近幾場的錄音
