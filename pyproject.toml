[project]
name = "live-translator"
version = "0.1.0"
description = "本機 GPU 即時日翻中字幕（Whisper + 本機 LLM）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
    "pyaudiowpatch",
    "PySide6",
    "websockets>=13",
    "httpx",
    "opencc-python-reimplemented",
    "yt-dlp",
    "pyyaml",
    "numpy",
    "soxr",
]

[project.optional-dependencies]
dev = ["pytest"]
# anime-whisper 辨識模型需要（PyTorch 請用 CUDA 版：pip install torch --index-url https://download.pytorch.org/whl/cu128）
anime = ["torch", "transformers>=4.45", "accelerate"]

[project.scripts]
live-translator = "live_translator.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
